services:
  backend:
    build: .
    image: ${BACKEND_IMAGE:-ghcr.io/readle-skthon/readle-backend}:latest
    container_name: readle-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/readle_db
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - GEMINI_KEY=${GEMINI_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - readle-network

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=readle_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d readle_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - readle-network

networks:
  readle-network:
    driver: bridge

volumes:
  postgres-data:
