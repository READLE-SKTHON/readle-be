services:
  backend:
    build: . # 로컬 Dockerfile로 직접 빌드
    container_name: readle-backend
    ports:
      - "8080:8080" # 호스트 컴퓨터 8080 포트를 컨테이너의 8080 포트와 매핑
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - readle-network

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=readle_db
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d readle_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - readle-network

networks:
  readle-network:
    driver: bridge

volumes:
  postgres-data: