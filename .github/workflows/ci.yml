name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: readle_db
          POSTGRES_USER: readle
          POSTGRES_PASSWORD: readle123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U readle"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build
        env:
          DB_URL: jdbc:postgresql://localhost:5432/readle_db
          DB_USERNAME: readle
          DB_PASSWORD: readle123