name: CI

on:
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # DB 는 Testcontainers 가 테스트 실행 시 자동 기동한다 (ubuntu-latest 에 Docker 포함).
      - name: Build and test
        run: ./gradlew build
